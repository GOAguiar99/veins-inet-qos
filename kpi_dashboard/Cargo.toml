[package]
name = "kpi_dashboard"
version = "0.1.0"
edition = "2021"
default-run = "kpi_dashboard"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
